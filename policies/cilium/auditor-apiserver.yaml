apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: auditor-to-apiserver
  namespace: zt-app
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: auditor
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}

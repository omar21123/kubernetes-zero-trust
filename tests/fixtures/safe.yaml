apiVersion: "v1"
kind: "Pod"
metadata:
  name: "admission-safe"
  namespace: "zt-untrusted"
  labels:
    app: "admission-test"
spec:
  restartPolicy: "Never"
  serviceAccountName: "probe"
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: "RuntimeDefault"
  containers:
    -
      name: "test"
      image: "zero-trust-demo:1.0.0"
      imagePullPolicy: "Never"
      command:
        ["python","-c","print('safe')"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            ["ALL"]
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "96Mi"

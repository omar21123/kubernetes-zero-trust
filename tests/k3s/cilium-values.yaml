# Cilium sur le k3s de la CI (seul CNI). Pour EKS : cluster/cilium-eks.yaml.
ipam:
  mode: kubernetes          # k3s attribue la plage d'IP des pods au nœud
kubeProxyReplacement: false # k3s garde son kube-proxy pour les Services
operator:
  replicas: 1               # un seul nœud dans ce laboratoire
hubble:
  enabled: true             # observabilité : voir les flux autorisés / refusés
  relay:
    enabled: true
  ui:
    enabled: true

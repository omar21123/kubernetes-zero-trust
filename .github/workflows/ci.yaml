name: Validation Zero Trust
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -v
      - name: Installer Kyverno CLI 1.15.2 et verifier les politiques
        run: |
          curl --fail --location --silent --show-error -o /tmp/kyverno.tar.gz https://github.com/kyverno/kyverno/releases/download/v1.15.2/kyverno-cli_v1.15.2_linux_x86_64.tar.gz
          echo "c90520ba24fb8b8df003ec22d6d2621e4a3d3c7497665fdcf84e9eab4ff1dfe0  /tmp/kyverno.tar.gz" | sha256sum --check
          tar -xzf /tmp/kyverno.tar.gz -C /tmp kyverno
          sudo install /tmp/kyverno /usr/local/bin/kyverno
          kyverno test tests/kyverno --remove-color
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Verifier le code Terraform (sans compte AWS)
        working-directory: terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate
      - run: bash -n cluster/install-k3s.sh

  # Même installation que la VM AWS (cluster/install-k3s.sh), mais sur la machine de CI.
  integration:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.1
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.3
      - name: Installer k3s
        run: |
          sudo env KUBECONFIG_USER="$USER" bash cluster/install-k3s.sh
          cp ~/zero-trust.kubeconfig .
      - run: python tools/lab.py up
      - run: python tools/lab.py test
      - run: python tools/lab.py l7-on
      - run: python tools/lab.py test --l7
      - name: Diagnostics
        if: failure()
        run: |
          export KUBECONFIG=$PWD/zero-trust.kubeconfig
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl -n kube-system logs daemonset/cilium --tail=80 || true
          kubectl get clusterpolicy zt-workload-baseline -o yaml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-trust-results
          path: artifacts/*.json
          if-no-files-found: ignore

# Les 5 workloads. Tous partagent la même configuration de sécurité ;
# les commentaires du premier Deployment valent pour les autres.
# frontend -> api -> catalog : application à trois tiers.
# auditor : lit un seul ConfigMap via l'API Kubernetes (démonstration RBAC).
# probe   : pod « non fiable » qui ne doit rien pouvoir joindre.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: zt-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend               # label utilisé par les NetworkPolicy
    spec:
      serviceAccountName: frontend       # identité dédiée (manifests/10-identities.yaml)
      automountServiceAccountToken: false  # aucun jeton Kubernetes dans le pod
      securityContext:
        runAsNonRoot: true               # jamais root
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault           # filtre les appels système dangereux
      containers:
        - name: frontend
          image: python:3.13.7-slim      # image officielle, rien à construire
          command: ["python", "/app/server.py"]
          env:
            - name: TIER
              value: frontend
            - name: UPSTREAM
              value: "http://api.zt-app.svc.cluster.local:8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # système de fichiers en lecture seule
            capabilities:
              drop: ["ALL"]               # aucune capacité Linux
          resources:                     # limites CPU/mémoire obligatoires
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: app-code             # code Python publié par lab.py dans un ConfigMap
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: app-code
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: zt-edge
spec:
  type: ClusterIP                    # joignable seulement depuis le cluster
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---

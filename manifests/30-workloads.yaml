apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "auditor"
  namespace: "zt-app"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "auditor"
  template:
    metadata:
      labels:
        app: "auditor"
    spec:
      serviceAccountName: "auditor"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "auditor"
          image: "zero-trust-demo:1.0.0"
          imagePullPolicy: "Never"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                ["ALL"]
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "96Mi"
          command:
            ["python","-c","import time; time.sleep(2147483647)"]
          volumeMounts:
            -
              name: "api-credentials"
              mountPath: "/var/run/zt-kubernetes"
              readOnly: true
      volumes:
        -
          name: "api-credentials"
          projected:
            defaultMode: 420
            sources:
              -
                serviceAccountToken:
                  path: "token"
                  expirationSeconds: 600
              -
                configMap:
                  name: "kube-root-ca.crt"
                  items:
                    -
                      key: "ca.crt"
                      path: "ca.crt"
---

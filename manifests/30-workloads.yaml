apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditor
  namespace: zt-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auditor
  template:
    metadata:
      labels:
        app: auditor
    spec:
      serviceAccountName: auditor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auditor
          image: python:3.13.7-slim
          command: ["python", "-c", "import time; time.sleep(2147483647)"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
            - name: api-credentials
              mountPath: /var/run/zt-kubernetes
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: app-code
        # Seul l'auditor reçoit un jeton : courte durée (10 min) et rotation automatique.
        - name: api-credentials
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---

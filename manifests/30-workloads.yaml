apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "frontend"
  namespace: "zt-edge"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "frontend"
  template:
    metadata:
      labels:
        app: "frontend"
    spec:
      serviceAccountName: "frontend"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "frontend"
          image: "zero-trust-demo:1.0.0"
          imagePullPolicy: "Never"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                ["ALL"]
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "96Mi"
          env:
            -
              name: "TIER"
              value: "frontend"
            -
              name: "UPSTREAM"
              value: "http://api.zt-app.svc.cluster.local:8080"
          ports:
            -
              containerPort: 8080
              name: "http"
          readinessProbe:
            httpGet:
              path: "/health"
              port: "http"
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: "/health"
              port: "http"
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "frontend"
  namespace: "zt-edge"
spec:
  type: "ClusterIP"
  selector:
    app: "frontend"
  ports:
    -
      name: "http"
      port: 8080
      targetPort: "http"
---
